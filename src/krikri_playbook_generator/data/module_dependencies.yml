# Per-module runtime dependencies for the podman template pair.
#
# The generator produces schema-valid arguments, but a module also needs
# its system package, Python library, and/or Ansible collection installed
# in the template images. This table is the UNION model: PodmanBackend
# provisions one Debian and one Rocky template per batch, installing the
# union of REAL_PACKAGES/KRIKRI_RUNTIME_LIBS plus everything listed here
# for the modules in scope. That keeps provisioning simple (two images,
# not one per module) and mirrors krikri/podman-diff's base installs.
#
# `supported:` is the chosen-support set (see Options --supported-community):
# empty by design until a module is deliberately promoted. Its FQCNs are
# appended to --modules discovery when the flag is given. Keys are FQCNs
# (`community.general.sudoers`), values are dependency lists.
#
# `debian_packages`, `rpm_packages`, `python_packages` (pip, REAL container
# only), `collections` (Galaxy, REAL container only) are partitioned by which
# side needs them: `real:` vs `krikri:` vs `both:` (same package both sides).
# This is why krikri/podman-diff splits installs: real ansible imports the
# module's Python library; krikri often shells to a binary or speaks a
# protocol natively and needs the package only, or vice versa.
#
# Keep entries minimal and verifiable: a package that doesn't exist in
# Debian trixie fails provisioning loudly rather than silently, which is
# the desired signal to remove it. Service modules needing a daemon or
# network (mariadb, docker, postgresql) are deliberately NOT listed here;
# they belong to a session-profile or Atlantic path, not the generic
# podman template.

supported: []

deb_modules:
  # Exactly the current REAL_PACKAGES/KRIKRI_RUNTIME_LIBS union, kept as
  # data so the backend no longer hard-codes a single string.
  both: [ansible, python3, procps, cron, gnupg, git, openssh-client, python3-apt, python3-debian, debconf-utils, rsync, sudo, iptables, subversion]
  real: [python3-pexpect, python3-idna]
  krikri: [libxml2, libssl3, openssl, libyaml-0-2, libpcre2-8-0, python3-cryptography]

rpm_modules:
  both: [python3, libyaml, pcre2, openssl, libxml2, zstd, gmp, gnupg2]
  real: [python3-pip, python3-dnf, python3-dnf-plugin-versionlock]
  krikri: []

# Example entry, kept empty-list valid YAML to document the schema:
# community.general.sudoers:
#   real:
#     debian_packages: []
#     python_packages: []
#     collections: []
#   krikri:
#     debian_packages: [sudo]
#     rpm_packages: []
#   both:
#     debian_packages: [sudo]
#     rpm_packages: []
