# Per-module runtime dependencies for the podman template pair.
#
# The generator produces schema-valid arguments, but a module also needs
# its system package, Python library, and/or Ansible collection installed
# in the template images. This table is the UNION model: PodmanBackend
# provisions one Debian and one Rocky template per batch, installing the
# base lists below plus everything listed here for the modules in scope. That keeps provisioning simple (two images,
# not one per module) and mirrors krikri/podman-diff's base installs.
#
# `supported:` is the chosen-support set (see Options --supported-community):
# empty by design until a module is deliberately promoted. Its FQCNs are
# appended to --modules discovery when the flag is given. Keys are FQCNs
# (`community.general.sudoers`), values are dependency lists.
#
# `debian_packages`, `rpm_packages`, `python_packages` (pip, REAL container
# only), `collections` (Galaxy, REAL container only) are partitioned by which
# side needs them: `real:` vs `krikri:` vs `both:` (same package both sides).
# This is why krikri/podman-diff splits installs: real ansible imports the
# module's Python library; krikri often shells to a binary or speaks a
# protocol natively and needs the package only, or vice versa.
#
# Keep entries minimal and verifiable: a package that doesn't exist in
# Debian trixie fails provisioning loudly rather than silently, which is
# the desired signal to remove it. Service modules needing a daemon or
# network (mariadb, docker, postgresql) are deliberately NOT listed here;
# they belong to a session-profile or Atlantic path, not the generic
# podman template.

supported: []

deb_modules:
  # The base template installs, kept as data so the backend no longer
  # hard-codes a single string.
  both: [ansible, python3, procps, cron, gnupg, git, openssh-client, python3-apt, python3-debian, debconf-utils, rsync, sudo, iptables, subversion]
  real: [python3-pexpect, python3-idna]
  # python3-pip: the pip module needs a working pip ON THE TARGET under both
  # engines - real imports it as a module under its own interpreter
  # (pip.py's _have_pip_module), krikri shells out to it (`python -m pip`,
  # then bare pip3) - so the krikri side must carry it too. The real side
  # additionally gets it from the ansible-core bootstrap below (pip is what
  # installs the pinned core), which is why it is not in `real` here.
  krikri: [libxml2, libssl3, openssl, libyaml-0-2, libpcre2-8-0, python3-cryptography, python3-pip]

rpm_modules:
  # libxcrypt-compat provides libcrypt.so.1, which the host-built krikri
  # binary links (Crystal pulls it for crypt(3)) and Rocky 10's default
  # package set no longer ships - the staged binary died with "cannot
  # open shared object file" right after the version assertion without
  # it (found launching the first 2.21.6 batch).
  both: [python3, libyaml, pcre2, openssl, libxml2, zstd, gmp, gnupg2, libxcrypt-compat]
  # python3-pexpect/python3-idna mirror the Debian real side: real expect
  # gates on pexpect, real uri on idna, so an rpm batch holding either
  # module errored as a harness gap ("multi-expect" and "multi-dnf5"
  # playbooks) until both were installed here too.
  real: [python3-pip, python3-dnf, python3-dnf-plugin-versionlock, python3-pexpect, python3-idna]
  # python3-pip on the krikri side too - same target-side requirement as the
  # Debian pair (see the comment there): both engines run pip on the target.
  krikri: [python3-pip]


# Per-module entries for the collections krikri implements. The real engine
# needs the module's own python library and the collection itself (the
# `collections` key feeds ansible-galaxy on the real side); krikri speaks the
# protocol/file format natively and usually needs only the system binary.
# Names are the Debian/Ubuntu and RPM spellings of the same requirement; a
# package that does not exist fails the template build loudly, which is the
# signal to correct the entry.

